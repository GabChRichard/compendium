<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="540" fill="#f7f6f2"/>
  <text x="20" y="32" fill="#333" font-size="20" font-weight="700">Plan d'éclairage d'une entrevue (vue de dessus)</text>

  <rect x="0" y="48" width="800" height="14" fill="#bdb8ad"/>
  <text x="20" y="82" fill="#777" font-size="14">Mur (1 à 2 m derrière la personne)</text>

  <line x1="400" y1="200" x2="280" y2="420" stroke="#888" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="300" y="300" fill="#777" font-size="13" transform="rotate(-61.4 300 300)">regard</text>

  <polygon points="168,238 392,186 392,214 168,262" fill="#ffcf40" fill-opacity="0.35"/>
  <polygon points="545,322 408,210 400,222" fill="#ffcf40" fill-opacity="0.25"/>
  <polygon points="555,90 405,190 415,200" fill="#ffcf40" fill-opacity="0.3"/>

  <g transform="translate(150 250) rotate(-17.7)">
    <rect x="-10" y="-26" width="18" height="52" fill="#444"/>
    <rect x="16" y="-30" width="5" height="60" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>
  <text x="40" y="300" fill="#b07800" font-size="16" font-weight="700">Lumière principale</text>
  <text x="40" y="320" fill="#555" font-size="14">(key) + diffuseur, à 45°</text>

  <g transform="translate(560 335) rotate(-135)">
    <rect x="-4" y="-28" width="8" height="56" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  </g>
  <text x="590" y="340" fill="#b07800" font-size="16" font-weight="700">Réflecteur</text>
  <text x="590" y="360" fill="#555" font-size="14">(fill) côté caméra</text>

  <g transform="translate(565 80) rotate(148)">
    <rect x="-10" y="-18" width="18" height="36" fill="#444"/>
  </g>
  <text x="590" y="112" fill="#b07800" font-size="16" font-weight="700">Contre-jour</text>
  <text x="590" y="132" fill="#555" font-size="14">(back light)</text>

  <circle cx="160" cy="130" r="16" fill="#ffe7a3" stroke="#c9a23a" stroke-width="2"/>
  <text x="185" y="135" fill="#555" font-size="14">Lampe du lieu (practical)</text>

  <circle cx="400" cy="200" r="30" fill="#d6b597" stroke="#7a5b43" stroke-width="2"/>
  <polygon points="386,226 394,244 402,228" fill="#d6b597" stroke="#7a5b43" stroke-width="2"/>
  <text x="440" y="190" fill="#222" font-size="16" font-weight="700">Personne</text>
  <text x="440" y="208" fill="#555" font-size="13">côté ombragé vers la caméra</text>

  <circle cx="270" cy="430" r="24" fill="#9fb4c9" stroke="#4d6378" stroke-width="2"/>
  <text x="120" y="470" fill="#222" font-size="16" font-weight="700">Intervieweur</text>
  <text x="120" y="488" fill="#555" font-size="13">juste à côté de l'objectif</text>

  <g transform="translate(470 445) rotate(-104.5)">
    <rect x="-22" y="-14" width="36" height="28" rx="3" fill="#222"/>
    <rect x="14" y="-8" width="16" height="16" fill="#555"/>
  </g>
  <text x="455" y="500" fill="#c62828" font-size="16" font-weight="700">Caméra A</text>
  <text x="455" y="518" fill="#555" font-size="13">plan demi-rapproché</text>
</svg>
